name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/eunni-dotcom/StorageInventory/blob/main/docs/roadmap.md) first: it lists what is planned and what is
        permanently out of scope (for example content inspection, hashing, deleting or moving files, telemetry).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or question, before any particular solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: safety
    attributes:
      label: Does this affect the read-only guarantee?
      description: For example, would it need to open file contents, follow links, or write anywhere new?
