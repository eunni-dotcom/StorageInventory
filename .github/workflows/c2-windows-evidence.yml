# TEMPORARY, evidence for the v1.1 C2 review only. Not part of C2 and never merged.
# Run 2: the release smoke test and a UI Automation diagnostic on the frozen base, on the C2 head, and on the C2 head
# with the views' ViewAutomationPeer removed (default UserControl peers), to find why the C2 smoke test could not
# find the "New scan" button.
name: C2 Windows evidence (temporary)

on:
  push:
    branches: ['v1.1/c2-windows-evidence']

permissions:
  contents: read

jobs:
  evidence:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base bf3fa36 (v1.1/c1-final), attempt A
            ref: bf3fa36c7c9f8f710e86762bbc20faaf9755ca02
          - name: base bf3fa36 (v1.1/c1-final), attempt B
            ref: bf3fa36c7c9f8f710e86762bbc20faaf9755ca02
          - name: C2 head, attempt A
            ref: ca7d3f5959c08c04e2f5a97dd2a918edbe21cfb1
          - name: C2 head, attempt B
            ref: ca7d3f5959c08c04e2f5a97dd2a918edbe21cfb1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidence-branch
          persist-credentials: false

      - name: Cache repo-local toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/dotnet
            tools/pwsh
            tools/psmodules
          key: tools-${{ runner.os }}-${{ hashFiles('tools/fetch-tools.ps1') }}

      - name: Fetch toolchain
        shell: powershell
        run: .\tools\fetch-tools.ps1

      - name: Build the synthetic benchmark trees (10k, 60k, 250k files), as in run 1
        shell: powershell
        run: |
          . .\powershell\tests\TestLib.ps1
          $perf = Join-Path ([IO.Path]::GetTempPath()) 'StorageInventoryPerf'
          foreach ($size in 10000, 60000, 250000) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            New-BulkFixture -Root (Join-Path $perf "tree_$size") -Artists ([int][Math]::Ceiling($size / 1000.0)) -Albums 25 -Tracks 40
            "tree_$size built in $([Math]::Round($sw.Elapsed.TotalSeconds)) s"
          }

      - name: Build and test (Release), with the trees present, as in run 1
        shell: powershell
        run: .\build.ps1 -Target Test -Configuration Release

      - name: Publish self-contained executable
        shell: powershell
        run: .\build.ps1 -Target Publish

      - name: Release smoke test, right after the tests, as in run 1
        id: smoke
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\smoke\Invoke-ReleaseSmokeTest.ps1 -Source (Join-Path $pwd 'docs') -LargeSource (Join-Path ([IO.Path]::GetTempPath()) 'StorageInventoryPerf\tree_250000')

      - name: After a failed smoke test, attach to the app and probe
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\evidence-branch\.github\evidence\uia-attach.ps1

      - name: Release smoke test, 5 more times
        continue-on-error: true
        shell: powershell
        run: |
          $large = Join-Path ([IO.Path]::GetTempPath()) 'StorageInventoryPerf\tree_250000'
          $failures = @()
          foreach ($i in 1..5) {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\smoke\Invoke-ReleaseSmokeTest.ps1 -Source (Join-Path $pwd 'docs') -LargeSource $large *>&1 | Out-String
            $code = $LASTEXITCODE
            "SMOKE iteration $i : exit $code, $(([regex]::Matches($out, '(?m)^PASS ')).Count) PASS lines"
            if ($code -ne 0) { $failures += $i; Write-Host $out; Get-Process StorageInventory -ErrorAction SilentlyContinue | Stop-Process }
          }
          "SMOKE SUMMARY: $(5 - $failures.Count) of 5 passed; failed iterations: $($failures -join ', ')"
