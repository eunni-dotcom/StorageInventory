# TEMPORARY, evidence for the v1.1 C2 review only. Not part of C2 and never merged.
# Run 2: the release smoke test and a UI Automation diagnostic on the frozen base, on the C2 head, and on the C2 head
# with the views' ViewAutomationPeer removed (default UserControl peers), to find why the C2 smoke test could not
# find the "New scan" button.
name: C2 Windows evidence (temporary)

on:
  push:
    branches: ['v1.1/c2-windows-evidence']

permissions:
  contents: read

jobs:
  evidence:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base bf3fa36 (v1.1/c1-final)
            ref: bf3fa36c7c9f8f710e86762bbc20faaf9755ca02
            variant: none
          - name: C2 head
            ref: ca7d3f5959c08c04e2f5a97dd2a918edbe21cfb1
            variant: none
          - name: C2 head without ViewAutomationPeer (diagnostic variant)
            ref: ca7d3f5959c08c04e2f5a97dd2a918edbe21cfb1
            variant: default-peers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidence-branch
          persist-credentials: false

      - name: Cache repo-local toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/dotnet
            tools/pwsh
            tools/psmodules
          key: tools-${{ runner.os }}-${{ hashFiles('tools/fetch-tools.ps1') }}

      - name: Fetch toolchain
        shell: powershell
        run: .\tools\fetch-tools.ps1

      - name: "Diagnostic variant - remove the views' ViewAutomationPeer"
        if: matrix.variant == 'default-peers'
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem src\StorageInventory.App\Views\*.xaml.cs) {
            $t = [IO.File]::ReadAllText($f.FullName)
            $u = $t.Replace("    protected override AutomationPeer OnCreateAutomationPeer() => new ViewAutomationPeer(this);`n", "")
            if ($u -ne $t) { [IO.File]::WriteAllText($f.FullName, $u); "patched $($f.Name)" }
          }
          git diff --stat

      - name: Build the 250k-file tree for the smoke test's cancelled scan
        shell: powershell
        run: |
          . .\powershell\tests\TestLib.ps1
          New-BulkFixture -Root (Join-Path ([IO.Path]::GetTempPath()) 'StorageInventoryPerf\tree_250000') -Artists 250 -Albums 25 -Tracks 40

      - name: Publish self-contained executable
        shell: powershell
        run: .\build.ps1 -Target Publish

      - name: Release smoke test
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\smoke\Invoke-ReleaseSmokeTest.ps1 -Source (Join-Path $pwd 'docs') -LargeSource (Join-Path ([IO.Path]::GetTempPath()) 'StorageInventoryPerf\tree_250000')

      - name: UI Automation diagnostic
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\evidence-branch\.github\evidence\uia-dump.ps1 -Source (Join-Path $pwd 'docs') -Exe (Join-Path $pwd 'dist\StorageInventory.exe')
